  <style>

    :root{ --ink:#141110; --fg:#f3ede4; --fg-dim:#cfc6b8; --amber:#e2a45c; --red:#b8352c;
      --serif:"Fraunces","Georgia",serif; --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--sans);background:var(--ink);color:var(--fg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;position:relative;overflow:hidden;-webkit-font-smoothing:antialiased}
    .glow{position:absolute;inset:auto -10% -40% -10%;height:70%;background:radial-gradient(55% 100% at 50% 100%,rgba(226,164,92,.14),transparent 70%);pointer-events:none}
    main{position:relative;max-width:34rem;text-align:center}
    .kicker{font-size:.74rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--amber);margin-bottom:1.3rem}
    h1{font-family:var(--serif);font-weight:500;font-size:clamp(2.1rem,6.5vw,3.4rem);line-height:1.06;letter-spacing:-.01em}
    h1 em{font-style:italic;color:var(--amber);font-weight:400}
    p.sub{color:var(--fg-dim);font-size:1.04rem;margin:1.1rem 0 2rem}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;gap:.5rem;font-weight:600;font-size:.95rem;border-radius:8px;padding:.85rem 1.5rem;background:var(--red);color:#fff;text-decoration:none;transition:transform .18s ease,background .18s ease}
    a:hover{background:#a12d24;transform:translateY(-2px)}
    :focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:3px}
    @media (prefers-reduced-motion:reduce){a{transition:none}a:hover{transform:none}}
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <main>
    <p class="kicker">Fehler 404</p>
    <h1>Diese Seite steht <em>nicht auf dem Programm</em>.</h1>
    <p class="sub">Der Link führt ins Leere. Zurück zur Startseite, dort geht es weiter.</p>
    <a href="/">Zur Startseite</a>
  </main>
</body>
</html>
